name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild from the raw export
        run: python scripts/build.py

      - name: Validate
        run: python scripts/validate.py

      - name: Generated files must be committed
        run: git diff --exit-code data/specs.json data/specs.csv data/by-country

      - name: Check that examples still run
        run: |
          python examples/python_example.py
          node examples/javascript_example.mjs
